<title>Corley's Island Art Prompts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky filter strip over a single column of prompt cards, copy button on the card's right edge */
:root{
  --bg:#eceef0; --card:#ffffff; --ink:#1b1f23; --mute:#5b646c; --line:#cdd3d8;
  --accent:#f2b800; --on-accent:#1b1f23; --ok:#1f8a4c; --chip:#e1e5e8;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13171a;--card:#1c2226;--ink:#e7eaec;--mute:#98a2aa;--line:#2f383e;--ok:#4cc27d;--chip:#262e33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13171a;--card:#1c2226;--ink:#e7eaec;--mute:#98a2aa;--line:#2f383e;--ok:#4cc27d;--chip:#262e33;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
header{padding-top:20px}
h1{font:700 34px/1 var(--display);letter-spacing:.01em;margin:0 0 6px;text-transform:uppercase}
header p{margin:0;color:var(--mute);max-width:60ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:12px 0 10px;margin-top:14px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:6px;padding:7px 12px;font:600 15px var(--body);cursor:pointer;min-height:40px}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tab small{font:500 12px var(--mono);opacity:.75;margin-left:6px}
.opts{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}
.opts label{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:14px;min-width:0}
.opts input{width:20px;height:20px;accent-color:var(--ok)}
.prog{font:500 13px var(--mono);color:var(--mute)}
.meter{height:6px;background:var(--chip);border-radius:3px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
main{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.done{opacity:.62}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.top>div{min-width:0}
.id{font:500 12px var(--mono);color:var(--mute);letter-spacing:.04em}
h2{font:700 21px/1.1 var(--display);margin:2px 0 0;text-transform:uppercase;letter-spacing:.01em}
.done h2{text-decoration:line-through;text-decoration-thickness:2px}
.tick{flex:none;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);cursor:pointer;min-height:40px}
.tick input{width:22px;height:22px;accent-color:var(--ok)}
.text{margin:0;font-size:15px;overflow-wrap:anywhere}
.meta{font:500 12px/1.4 var(--mono);color:var(--mute);overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
button.copy,button.alt{font:600 16px var(--body);border-radius:6px;padding:10px 16px;min-height:44px;cursor:pointer}
button.copy{background:var(--accent);color:var(--on-accent);border:0;flex:1 1 150px}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line);flex:0 1 auto}
button:focus-visible,.tab:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}
details{font-size:13px;color:var(--mute)}
summary{cursor:pointer;min-height:28px}
details p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.shot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.shot img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--chip)}
.shot span{font-size:13px;color:var(--mute)}
label.up{display:inline-flex;align-items:center;justify-content:center;font:600 16px var(--body);border:1px solid var(--ink);border-radius:6px;padding:10px 16px;min-height:44px;cursor:pointer}
label.up:focus-within{outline:3px solid var(--ink);outline-offset:2px}
label.up input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drive{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drive input[type=url]{flex:1 1 200px;min-width:0;min-height:44px;font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.drive a{font-size:13px;color:var(--ink);overflow-wrap:anywhere}
.note{color:var(--mute);font-size:14px;margin:0 0 4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
<header>
  <h1>Art prompts</h1>
  <p>Tap Copy, paste into ChatGPT's image maker, save the result as the file named on the card, then tick it off. Ground and material prompts for the Ultra graphics tier ask for the biggest, finest detail; the phone sizes are cut from that one image later.</p>
</header>
<div class="bar">
  <div class="tabs" id="tabs" role="group" aria-label="Prompt groups"></div>
  <div class="opts">
    <label><input type="checkbox" id="proj"> Style blocks are already in my ChatGPT Project</label>
    <span class="prog" id="prog"></span>
  </div>
  <div class="meter"><i id="meter"></i></div>
</div>
<main id="list"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const D={"style": "STYLE: game-ready asset for a modern, photorealistic construction simulation game set on a lake in the mountains; true-to-life materials, accurate real-world scale and colour, crisp high-resolution detail, the look of a AAA PBR game. Flat, even, shadowless lighting (no baked shadows, no sun glare, no vignette), so the game can light it. No text, logos, watermarks, borders or people unless asked. Natural, realistic colours: red clay, sun-bleached grass, lake blue, safety yellow.", "texture": "TEXTURE: perfectly seamless tiling, top-down orthographic view, filling the whole square edge to edge, no perspective, no single focal object, no visible repeat pattern or obvious large features, even lighting across the whole tile, 1:1 square. Ultra detail at pixel level: fine grain, tiny pebbles, hairline cracks. Real-world scale: the tile covers about 1 metre (3 ft).", "pbr": "Now, using the exact same texture, give me: (1) the HEIGHT map as a black-and-white image, white = highest, grey midtones, same framing and seamless; (2) the ROUGHNESS map as black-and-white, white = rough and dry, darker = smooth or wet. Same framing, same seams, no other changes. (The normal map is made from the height map by tools/make_tiers.py --normal.)", "sections": [{"key": "G", "title": "Ground and terrain", "add": "", "items": [{"id": "G01", "title": "Dirt, dry red clay", "file": "ground/dirt.jpg", "needs": "the dig site, Q15", "text": "[STYLE][TEXTURE] Dry packed red-brown clay soil with tiny pebbles, fine hairline cracks, a few crumbs and faint tyre-scuff grain; rust-orange with small darker patches.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "G02", "title": "Dirt, wet", "file": "ground/dirt_wet.jpg", "needs": "W01, D02, Q15 wet-surface darkening", "text": "[STYLE][TEXTURE] The same red clay but soaked: dark chocolate-red, smooth glossy-looking surface, tiny water beads, a few shallow standing-water films, and fine smooth sticky texture.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "G03", "title": "Grass, summer", "file": "ground/grass.jpg", "needs": "K01, K10", "text": "[STYLE][TEXTURE] Mown lawn grass seen from above: tight short blades in many directions, mid-green with yellow-green and a few dry straw blades, tiny clover leaves scattered. Blade-level detail.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "G04", "title": "Grass, long and weedy", "file": "ground/grass_long.jpg", "needs": "K08, S10", "text": "[STYLE][TEXTURE] Unmown field grass seen from above: long blades lying in swirls, golden-green with seed heads, dandelion leaves and a few white clover flowers.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "G05", "title": "Grass, autumn", "file": "ground/grass_fall.jpg", "needs": "W04, Q15 richer autumn", "text": "[STYLE][TEXTURE] Lawn grass in autumn from above: dry khaki and straw-gold blades mixed with green, scattered fallen oak and maple leaves in red, orange and brown, a few acorns.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "G06", "title": "Rock layer", "file": "ground/rock.jpg", "needs": "D03, S03, X03", "text": "[STYLE][TEXTURE] Grey-tan sandstone bedrock from above: flat fractured slabs with crisp joint lines, layered strata, lichen specks, little chips and grit in the cracks.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "G07", "title": "Gravel road", "file": "ground/gravel_road.jpg", "needs": "rim road, M06", "text": "[STYLE][TEXTURE] Compacted crushed-limestone gravel road: grey-beige angular stones of mixed size, dust in the gaps, two faint darker tyre-track lines running vertically through the middle third only if they still tile.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "G08", "title": "Sand, beach", "file": "ground/sand_beach.jpg", "needs": "S16, H19", "text": "[STYLE][TEXTURE] Pale warm beach sand from above: fine grains, soft ripple lines, a few shell fragments, tiny dark pebbles, a little driftwood splinter.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "G09", "title": "Wet sand at the waterline", "file": "ground/sand_wet.jpg", "needs": "S16, W10", "text": "[STYLE][TEXTURE] Wet dark-tan sand as the tide leaves it: smooth glossy surface, fine ripples, tiny air-bubble holes, a few small pebbles.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "G10", "title": "Mud, rutted", "file": "ground/mud_ruts.jpg", "needs": "D02, mud.js", "text": "[STYLE][TEXTURE] Churned brown mud with overlapping tyre and track ruts, glossy brown water pooled in the ruts, clods and smears, sticky texture.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "G11", "title": "Cracked dry mud", "file": "ground/mud_cracked.jpg", "needs": "soakMax, D12", "text": "[STYLE][TEXTURE] Sun-dried pale clay mud broken into curled polygon plates with deep cracks, light tan on top, darker in the cracks.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "G12", "title": "Snow", "file": "ground/snow.jpg", "needs": "W04, R07", "text": "[STYLE][TEXTURE] Fresh snow from above: soft sparkling blue-white surface, gentle wind ripples, tiny ice crystals, a few grass tips poking out.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "G13", "title": "Machine grime overlay", "file": "ground/grime.jpg", "needs": "Q04, X11 (matches the existing grime layer)", "text": "[STYLE][TEXTURE] A grey-scale grime and dirt-streak mask: soft vertical drips, speckles and smudges, mid-grey base, no hard edges.", "png": false, "tex": false, "pbr": false, "sprite": false}, {"id": "G14", "title": "Macro variation", "file": "ground/macro.jpg", "needs": "ground on High/Ultra", "text": "[STYLE][TEXTURE] A very soft low-frequency grey cloud map of large blotches, no fine detail, mid-grey average, tiling; it only brightens and darkens big patches of ground.", "png": false, "tex": false, "pbr": false, "sprite": false}]}, {"key": "P", "title": "Materials and surfaces", "add": "", "items": [{"id": "P01", "title": "Painted yellow steel with wear", "file": "materials/yellowsteel_pbr.jpg", "needs": "Q15 machine PBR", "text": "[STYLE][TEXTURE] Safety-yellow painted construction-machine steel, orange-peel paint grain, edge wear showing grey metal, light dust, tiny scratches, a few rivets.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "P02", "title": "Rubber track pad / rubber", "file": "materials/rubber.jpg", "needs": "", "text": "[STYLE][TEXTURE] Black rubber with a worn cross-hatch tread and fine dust, matte.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "P03", "title": "Diamond plate", "file": "materials/diamond_pbr.jpg", "needs": "", "text": "[STYLE][TEXTURE] Raised diamond-pattern steel tread plate, bright scuffed steel with dark dirt in the grooves.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "P04", "title": "Rusty corrugated metal", "file": "materials/corrugated_rust.jpg", "needs": "S01, H10", "text": "[STYLE][TEXTURE] Old corrugated roofing sheet, vertical ribs, faded blue-grey paint peeling to orange rust, bolt heads.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "P05", "title": "Weathered wood planks, porch", "file": "materials/planks_porch.jpg", "needs": "H01, S05, S21", "text": "[STYLE][TEXTURE] Grey-brown weathered horizontal deck boards with tight gaps, nail heads, knots and sun-bleached grain.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "P06", "title": "Painted white clapboard", "file": "materials/clapboard_white.jpg", "needs": "I02 farmhouse", "text": "[STYLE][TEXTURE] White-painted horizontal lap siding, slight dirt streaks, clean shadow-free lines.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "P07", "title": "Cedar shingle roof", "file": "materials/shingle_cedar.jpg", "needs": "H01, S22", "text": "[STYLE][TEXTURE] Weathered cedar shake roof shingles in staggered rows, silver-brown with moss in a few lower edges.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "P08", "title": "Red barn board", "file": "materials/barn_red.jpg", "needs": "H10, I10", "text": "[STYLE][TEXTURE] Old red barn vertical board-and-batten siding, flaking paint over grey wood.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "P09", "title": "Concrete, poured and stained", "file": "materials/concrete_pbr.jpg", "needs": "J07, J12", "text": "[STYLE][TEXTURE] Poured concrete slab, pale grey, small pinholes, trowel swirls, hairline cracks and faint stains.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "P10", "title": "Asphalt, bridge road", "file": "materials/asphalt_pbr.jpg", "needs": "B01", "text": "[STYLE][TEXTURE] Worn dark asphalt with aggregate showing, sealed crack lines and fine grit; no lane markings.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "P11", "title": "Bridge truss steel", "file": "materials/truss_steel.jpg", "needs": "B01, B10", "text": "[STYLE][TEXTURE] Dull grey-green painted structural steel with bolt-head rows and light rust streaks.", "png": false, "tex": true, "pbr": true, "sprite": false}, {"id": "P12", "title": "Pipe: PVC, ductile iron", "file": "materials/pipe_pvc.jpg, materials/pipe_iron.jpg", "needs": "J04", "text": "[STYLE][TEXTURE] (a) Smooth white PVC pipe surface with a faint printed-stripe feel but no text; (b) rough dark-grey cast ductile iron with a red-oxide coat. Two separate 1:1 squares.", "png": false, "tex": false, "pbr": false, "sprite": false}, {"id": "P13", "title": "Water, lake surface (tiling)", "file": "materials/water_lake.jpg", "needs": "Q13", "text": "[STYLE][TEXTURE] Calm lake water from above, deep teal blue, small soft ripple rings and long swell lines, bright thin highlights on ripple tops, no foam.", "png": false, "tex": true, "pbr": false, "sprite": false}, {"id": "P14", "title": "Shore foam strip", "file": "materials/foam_strip.png", "needs": "Q11, Q14. Transparent PNG", "text": "[STYLE] A horizontal tileable strip (4:1), broken white foam lace and bubbles on a transparent background, soft edges, tiling left to right.", "png": true, "tex": false, "pbr": false, "sprite": true}, {"id": "P15", "title": "Leaf atlas, autumn", "file": "materials/leaves_fall.png", "needs": "W04, Q15. Transparent PNG", "text": "[STYLE] A 4x4 sheet of 16 separate autumn leaves (oak, maple, birch, aspen) in reds, oranges, golds and browns, each flat top-down on a transparent background, even spacing, no overlap, no shadows.", "png": true, "tex": false, "pbr": false, "sprite": true}]}, {"key": "F", "title": "Effects and sprites", "add": "", "items": [{"id": "F01", "title": "Smoke puffs", "file": "fx/smoke.png", "needs": "Q01", "text": "[STYLE] A 4x4 sheet of 16 soft diesel smoke puffs of different shapes in grey-black on a transparent background, soft-edged, each in its own equal cell, no ground, no glow.", "png": true, "tex": false, "pbr": false, "sprite": true}, {"id": "F02", "title": "Dust puffs", "file": "fx/dust.png", "needs": "Q03, D07", "text": "[STYLE] A 4x4 sheet of 16 tan-brown dust puffs on transparent, soft edges, varied sizes, equal cells.", "png": true, "tex": false, "pbr": false, "sprite": true}, {"id": "F03", "title": "Rain drops and ring splashes", "file": "fx/rain.png", "needs": "W01, W09", "text": "[STYLE] A 4x2 sheet on transparent: top row four thin angled rain streaks, bottom row four expanding water-ring splashes seen from above, white-blue.", "png": true, "tex": false, "pbr": false, "sprite": true}, {"id": "F04", "title": "Sparks", "file": "fx/sparks.png", "needs": "Q05, U04", "text": "[STYLE] A 4x2 sheet of bright orange-yellow spark bursts and streaks on transparent, hot white centres.", "png": true, "tex": false, "pbr": false, "sprite": true}, {"id": "F05", "title": "Snow and fireflies", "file": "fx/specks.png", "needs": "W04, W11", "text": "[STYLE] A 4x2 sheet on transparent: top row soft white snowflakes, bottom row warm yellow-green glowing fireflies with soft halos.", "png": true, "tex": false, "pbr": false, "sprite": true}, {"id": "F06", "title": "Cloud sprites", "file": "fx/clouds.png", "needs": "W02, W06", "text": "[STYLE] A 3x2 sheet of six puffy realistic cumulus clouds, soft white with light grey undersides, on transparent, no sky.", "png": true, "tex": false, "pbr": false, "sprite": true}]}, {"key": "E", "title": "Sky, water and environment", "add": "", "items": [{"id": "E01", "title": "Skybox panorama, noon", "file": "sky/noon.jpg", "needs": "Q15 HDR sky", "text": "[STYLE] A seamless 2:1 equirectangular sky panorama, noon, clear blue gradient to pale horizon haze, a few thin cirrus streaks, no sun disc, no ground, left and right edges match.", "png": false, "tex": false, "pbr": false, "sprite": false}, {"id": "E02", "title": "Skybox, sunset over the lake", "file": "sky/sunset.jpg", "needs": "W02", "text": "[STYLE] A seamless 2:1 equirectangular sky panorama at sunset: gold and orange glow at one side, violet and navy overhead, streaks of pink cloud, no ground, edges match.", "png": false, "tex": false, "pbr": false, "sprite": false}, {"id": "E03", "title": "Skybox, night", "file": "sky/night.jpg", "needs": "W02", "text": "[STYLE] A seamless 2:1 equirectangular night sky: deep navy, thin Milky Way band, a few hundred stars, no moon, no ground, edges match.", "png": false, "tex": false, "pbr": false, "sprite": false}, {"id": "E04", "title": "Skybox, fog morning", "file": "sky/fog.jpg", "needs": "W06", "text": "[STYLE] A seamless 2:1 equirectangular misty dawn sky: soft grey-pink gradient, no features, edges match.", "png": false, "tex": false, "pbr": false, "sprite": false}, {"id": "E05", "title": "Distant mountain ridgeline", "file": "sky/mountains.png", "needs": "B04, T01, T13", "text": "[STYLE] A seamless horizontally tiling strip (6:1) of layered blue-grey pine mountain ridges fading into haze, transparent above the top ridge, realistic, three depth layers.", "png": true, "tex": false, "pbr": false, "sprite": true}, {"id": "E06", "title": "Far-shore town lights", "file": "sky/town_night.png", "needs": "S08, T10", "text": "[STYLE] A tileable 8:1 strip of a far lakeshore at night: small clusters of warm yellow window lights and a few white street lights, on transparent.", "png": true, "tex": false, "pbr": false, "sprite": true}, {"id": "E07", "title": "Skyline", "file": "sky/skyline.png", "needs": "T13, T12", "text": "[STYLE] A tileable 8:1 hazy blue-grey city skyline of simple blocky towers in silhouette with a few lit windows, transparent above.", "png": true, "tex": false, "pbr": false, "sprite": true}]}, {"key": "U", "title": "Interface icons", "add": "Clean modern game-UI icon style with realistic detail and soft shading, a single bold subject centred on a transparent background, readable at 64 px, no text.", "items": [{"id": "U01", "title": "Machine icons", "file": "ui/machines.png", "needs": "M01-M23", "text": "[STYLE] A 6x4 sheet, equal cells, in this order: excavator, dump truck, wheel loader, skid steer, bulldozer, backhoe loader, mini excavator, motor grader, roller, water truck, articulated hauler, concrete mixer, crane truck, side-by-side, johnboat, kayak, pontoon boat, floatplane, tractor, telehandler, zero-turn mower, pickup truck, lowboy trailer, golf cart.", "png": true, "tex": false, "pbr": false, "sprite": true}, {"id": "U02", "title": "Tool and attachment icons", "file": "ui/tools.png", "needs": "X01-X05, X12", "text": "[STYLE] A 4x3 sheet in this order: bucket, thumb, hydraulic hammer, ditching bucket, auger, tiltrotator, quick coupler, pallet forks, grapple, angle broom, box blade, ripper.", "png": true, "tex": false, "pbr": false, "sprite": true}, {"id": "U03", "title": "Utility marks", "file": "ui/utility_marks.png", "needs": "J02, U01", "text": "[STYLE] A 6x1 sheet of flat spray-paint style survey marks and flags on transparent: yellow gas, red power, blue water, orange telecom, green sewer, white dig-line; no words.", "png": true, "tex": false, "pbr": false, "sprite": true}, {"id": "U04", "title": "Weather and time icons", "file": "ui/weather.png", "needs": "W01-W06, R03", "text": "[STYLE] A 4x2 sheet: sun, cloud, rain, thunderstorm, fog, snow, moon, wind.", "png": true, "tex": false, "pbr": false, "sprite": true}, {"id": "U05", "title": "Badges", "file": "ui/badges.png", "needs": "Y01", "text": "[STYLE] A 4x3 sheet of 12 round achievement badges, each a different construction subject (first trench, yardage, safety, perfect grade, pipe layer, pond, lighthouse, regatta, fish, garden, mower, bridge), in bright metal-rimmed enamel style, no text.", "png": true, "tex": false, "pbr": false, "sprite": true}, {"id": "U06", "title": "Produce, pantry and finds", "file": "ui/items.png", "needs": "H04, H08, H18, D04, H11", "text": "[STYLE] A 6x4 sheet of 24 small items: tomato, okra, pepper, egg, bass, bream, shell, sea glass, driftwood, old bottle, horseshoe, arrowhead, time capsule, coffee mug, s'more, ice cream, trowel, trimmer line, gas can, seed packet, apple, peach, pumpkin, jar.", "png": true, "tex": false, "pbr": false, "sprite": true}]}, {"key": "S", "title": "Scenery concept sheets", "add": "Three-quarter view on a plain light grey background, realistic 3D game-model render style, front, side and back views of the same object on one sheet.", "items": [{"id": "S01", "title": "Job trailer, porta-john, fuel tank, pipe rack", "file": "concept/site_props.png", "needs": "S01, S02", "text": "[STYLE] [concept sheet] A construction site prop set: office trailer, porta-john, skid fuel tank, PVC pipe rack, traffic cones, barricade, caution tape stand, job sign, light tower.", "png": true, "tex": false, "pbr": false, "sprite": true}, {"id": "S02", "title": "Lighthouse", "file": "concept/lighthouse.png", "needs": "S22, I12", "text": "[STYLE] [concept sheet] A small white lighthouse with a red lantern room and heet] One oak, one maple and one pine each in summer, autumn and winter.", "png": true, "tex": false, "pbr": false, "sprite": true}]}]};
const KEYS=['all'].concat(D.sections.map(s=>s.key));
let tab='all',proj=false,done={},imgs={},drv={},A=null,DB=null,lastId='';
try{done=JSON.parse(localStorage.getItem('art_done')||'{}');proj=localStorage.getItem('art_proj')==='1';tab=localStorage.getItem('art_tab')||'all'}catch(e){}
if(!KEYS.includes(tab))tab='all';
const $=id=>document.getElementById(id);
const all=D.sections.flatMap(s=>s.items.map(i=>Object.assign({sec:s},i)));
function full(it){
  let t=it.text.replace('[concept sheet] ','');
  const body=t.replace('[STYLE]',proj?'':D.style+' ').replace('[TEXTURE]',proj?'':D.texture+' ');
  let out=body.trim();
  if(it.sec.add)out+=' '+it.sec.add;
  if(proj&&it.tex)out='(Use the project style and texture rules.) '+out;
  return out.replace(/\s+/g,' ').trim();
}
function save(){try{localStorage.setItem('art_done',JSON.stringify(done));localStorage.setItem('art_proj',proj?'1':'0');localStorage.setItem('art_tab',tab)}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1600)}
async function copy(text,btn,label){
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true}catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);
    try{ok=document.execCommand('copy')}catch(e2){}ta.remove()}
  if(ok){const old=btn.textContent;btn.textContent='Copied';btn.classList.add('ok');toast(label+' copied. Paste it into ChatGPT.');setTimeout(()=>{btn.textContent=old;btn.classList.remove('ok')},1400)}
  else toast('Copy was blocked. Open "See full text" and select it.');
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderTabs(){
  $('tabs').innerHTML=KEYS.map(k=>{
    const s=D.sections.find(x=>x.key===k),n=k==='all'?all.length:s.items.length,d=(k==='all'?all:s.items).filter(i=>done[i.id]).length;
    return `<button class="tab" data-k="${k}" aria-pressed="${k===tab}">${k==='all'?'All':esc(s.title.replace(/ and .*/,'').replace(/:.*/,''))}<small>${d}/${n}</small></button>`}).join('');
}
function render(){
  renderTabs();
  const items=tab==='all'?all:all.filter(i=>i.sec.key===tab);
  let h='',last='';
  for(const it of items){
    if(tab==='all'&&it.sec.key!==last){last=it.sec.key;h+=`<p class="note"><b>${esc(it.sec.title)}</b></p>`}
    const t=full(it);
    h+=`<article class="card${done[it.id]?' done':''}" id="c-${it.id}">
      <div class="top"><div><div class="id">${it.id}${it.needs?' &middot; serves '+esc(it.needs):''}</div><h2>${esc(it.title)}</h2></div>
      <label class="tick"><input type="checkbox" data-done="${it.id}" ${done[it.id]?'checked':''}> Made</label></div>
      <p class="text">${esc(it.text.replace('[STYLE]','').replace('[TEXTURE]','').replace('[concept sheet]','').trim())}</p>
      <div class="meta">Save as ${esc(it.file)}</div>
      <div class="acts"><button class="copy" data-copy="${it.id}">Copy prompt</button>${it.pbr?`<button class="alt" data-pbr="${it.id}">Copy height + roughness follow-up</button>`:''}</div>
      ${A&&DB?`<div class="shot">${imgs[it.id]?`<img src="${esc(imgs[it.id].url)}" alt="Uploaded image for ${it.id}"><span>Uploaded ${esc(imgs[it.id].name||'')}</span>`:''}
        <label class="up">${imgs[it.id]?'Replace image':'Upload image'}<input type="file" accept="image/*" data-up="${it.id}"></label>
        ${imgs[it.id]?`<button class="alt" data-rm="${it.id}">Remove</button>`:''}</div>`:''}
      ${DB?`<div class="drive">${drv[it.id]?`<span class="meta">Drive link saved:</span> <a href="${esc(drv[it.id].url)}" target="_blank" rel="noopener">${esc(drv[it.id].url.replace(/^https?:\/\//,'').slice(0,48))}</a> <button class="alt" data-rmd="${it.id}">Remove link</button>`:`<input type="url" id="dl-${it.id}" inputmode="url" placeholder="Paste Google Drive link" aria-label="Google Drive link for ${it.id}"><button class="alt" data-sd="${it.id}">Save link</button>`}</div>`:''}
      <details><summary>See full text</summary><p>${esc(t)}</p></details>
    </article>`}
  $('list').innerHTML=h;
  const d=all.filter(i=>done[i.id]).length;
  $('prog').textContent=d+' of '+all.length+' made';$('meter').style.width=(100*d/all.length)+'%';
  $('proj').checked=proj;
}
async function upload(id,file){
  const it=all.find(i=>i.id===id);if(!file||!it||!A||!DB)return;
  if(!/^image\//.test(file.type)){toast('That file is not an image.');return}
  toast('Uploading '+id+'...');
  try{
    const r=await A.upload(file);
    await DB.collection('images').doc(id).set({assetId:r.id,url:r.url,name:file.name||id,size:r.sizeBytes,type:r.contentType,target:it.file,title:it.title,at:Date.now()});
    done[id]=1;save();toast(id+' uploaded. Tell Claude to place it.')
  }catch(err){toast('Upload failed: '+((err&&err.message)||err.code||'try again'))}
}
document.addEventListener('paste',e=>{
  const f=[...(e.clipboardData?e.clipboardData.files:[])].find(x=>/^image\//.test(x.type));
  if(!f)return;if(!lastId){toast('Tap a card first, then paste.');return}
  e.preventDefault();upload(lastId,f)
});
document.addEventListener('click',e=>{
  const c=e.target.closest('.card');if(c)lastId=c.id.slice(2);
  const sd=e.target.closest('[data-sd]');
  if(sd&&DB){const id=sd.dataset.sd,it=all.find(i=>i.id===id),v=($('dl-'+id).value||'').trim();
    const m=v.match(/^https:\/\/(?:drive|docs)\.google\.com\//)&&(v.match(/\/(?:d|folders)\/([\w-]+)/)||v.match(/[?&]id=([\w-]+)/));
    if(!m){toast('That is not a Google Drive link.');return}
    DB.collection('drive').doc(id).set({url:v,fileId:m[1],folder:/\/folders\//.test(v),target:it.file,title:it.title,at:Date.now()}).then(()=>{done[id]=1;save();toast(id+' link saved. Tell Claude to place it.')}).catch(()=>toast('Could not save the link.'));return}
  const rmd=e.target.closest('[data-rmd]');
  if(rmd&&DB){DB.collection('drive').doc(rmd.dataset.rmd).delete().catch(()=>toast('Could not remove it.'));return}
  const rm=e.target.closest('[data-rm]');
  if(rm&&DB){DB.collection('images').doc(rm.dataset.rm).delete().catch(()=>toast('Could not remove it.'));return}
  const t=e.target.closest('[data-k],[data-copy],[data-pbr]');if(!t)return;
  if(t.dataset.k){tab=t.dataset.k;save();render();window.scrollTo({top:0})}
  else if(t.dataset.copy){const it=all.find(i=>i.id===t.dataset.copy);copy(full(it),t,it.id)}
  else if(t.dataset.pbr){copy(D.pbr,t,'Follow-up')}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.up){const f=e.target.files[0];upload(e.target.dataset.up,f);e.target.value='';return}
  if(e.target.id==='proj'){proj=e.target.checked;save();render();return}
  const id=e.target.dataset.done;if(!id)return;
  if(e.target.checked)done[id]=1;else delete done[id];
  save();const c=$('c-'+id);if(c)c.classList.toggle('done',!!done[id]);
  const d=all.filter(i=>done[i.id]).length;$('prog').textContent=d+' of '+all.length+' made';$('meter').style.width=(100*d/all.length)+'%';renderTabs();
});
render();
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    A=await window.claude.use('assets');DB=await window.claude.use('db');
    if(!DB){A=DB=null;return}
    DB.collection('drive').onSnapshot(snap=>{drv={};snap.docs.forEach(d=>{drv[d.id]=d.data()});render()},()=>{});
    DB.collection('images').onSnapshot(snap=>{imgs={};snap.docs.forEach(d=>{imgs[d.id]=d.data()});render()},()=>{});
  }catch(e){A=DB=null}
})();
</script>
