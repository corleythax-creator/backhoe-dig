<title>Corley's Island Art Prompts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky filter strip over a single column of prompt cards, copy button on the card's right edge */
:root{
  --bg:#eceef0; --card:#ffffff; --ink:#1b1f23; --mute:#5b646c; --line:#cdd3d8;
  --accent:#f2b800; --on-accent:#1b1f23; --ok:#1f8a4c; --chip:#e1e5e8;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13171a;--card:#1c2226;--ink:#e7eaec;--mute:#98a2aa;--line:#2f383e;--ok:#4cc27d;--chip:#262e33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13171a;--card:#1c2226;--ink:#e7eaec;--mute:#98a2aa;--line:#2f383e;--ok:#4cc27d;--chip:#262e33;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
header{padding-top:20px}
h1{font:700 34px/1 var(--display);letter-spacing:.01em;margin:0 0 6px;text-transform:uppercase}
header p{margin:0;color:var(--mute);max-width:60ch}
.bar{background:var(--bg);z-index:5;padding:12px 0 10px;margin-top:14px;border-bottom:1px solid var(--line)}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:6px;padding:7px 12px;font:600 15px var(--body);cursor:pointer;min-height:40px}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tab small{font:500 12px var(--mono);opacity:.75;margin-left:6px}
.opts{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}
.opts label{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:14px;min-width:0}
.opts input{width:20px;height:20px;accent-color:var(--ok)}
.sum{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.cnt{font:600 15px var(--body);border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:6px 10px;white-space:nowrap}
.cnt b{font:700 20px var(--display);margin-right:4px}
.cnt.q{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.cnt.g{border-color:var(--ok)}
button.send{font:700 16px var(--body);background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:10px 16px;min-height:44px;cursor:pointer}
button.send[disabled]{opacity:.4;cursor:default}
.card.q{border-color:var(--accent);box-shadow:inset 5px 0 0 var(--accent)}
.card.g{border-color:var(--ok)}
.badge{display:inline-block;font:700 11px var(--mono);letter-spacing:.06em;border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:1px}
.badge.q{background:var(--accent);color:var(--on-accent)}
.badge.g{background:var(--ok);color:#fff}
.meter{height:6px;background:var(--chip);border-radius:3px;margin-top:8px;overflow:hidden}
.meter{display:flex}
.meter i{display:block;height:100%;width:0;transition:width .25s}
#mg{background:var(--ok)}#mq{background:var(--accent)}
main{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.done{opacity:.62}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.top>div{min-width:0}
.id{font:500 12px var(--mono);color:var(--mute);letter-spacing:.04em}
h2{font:700 21px/1.1 var(--display);margin:2px 0 0;text-transform:uppercase;letter-spacing:.01em}
.done h2{text-decoration:line-through;text-decoration-thickness:2px}
.tick{flex:none;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);cursor:pointer;min-height:40px}
.tick input{width:22px;height:22px;accent-color:var(--ok)}
.text{margin:0;font-size:15px;overflow-wrap:anywhere}
.meta{font:500 12px/1.4 var(--mono);color:var(--mute);overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
button.copy,button.alt{font:600 16px var(--body);border-radius:6px;padding:10px 16px;min-height:44px;cursor:pointer}
button.copy{background:var(--accent);color:var(--on-accent);border:0;flex:1 1 150px}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line);flex:0 1 auto}
button:focus-visible,.tab:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}
details{font-size:13px;color:var(--mute)}
summary{cursor:pointer;min-height:28px}
details p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.shot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.shot img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--chip)}
.shot span{font-size:13px;color:var(--mute)}
label.up{display:inline-flex;align-items:center;justify-content:center;font:600 16px var(--body);border:1px solid var(--ink);border-radius:6px;padding:10px 16px;min-height:44px;cursor:pointer}
label.up:focus-within{outline:3px solid var(--ink);outline-offset:2px}
label.up input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drive{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drive input[type=url]{flex:1 1 200px;min-width:0;min-height:44px;font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.drive a{font-size:13px;color:var(--ink);overflow-wrap:anywhere}
.note{color:var(--mute);font-size:14px;margin:0 0 4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
<header>
  <h1>Art prompts</h1>
  <p>Tap Copy, paste into ChatGPT's image maker, save the result as the file named on the card, then tick it off. Ground and material prompts for the Ultra graphics tier ask for the biggest, finest detail; the phone sizes are cut from that one image later.</p>
</header>
<div class="bar">
  <div class="tabs" id="tabs" role="group" aria-label="Prompt groups"></div>
  <div class="sum">
    <div class="counts" aria-live="polite"><span class="cnt"><b id="nMade">0</b>made</span><span class="cnt q"><b id="nQ">0</b>queued</span><span class="cnt g"><b id="nG">0</b>in game</span></div>
    <button class="send" id="send" disabled>Send queued to Claude</button>
  </div>
  <div class="opts"><label><input type="checkbox" id="proj"> Style blocks are already in my ChatGPT Project</label></div>
  <div class="meter"><i id="mg"></i><i id="mq"></i></div>
</div>
<main id="list"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const D=/*DATA*/null;
const KEYS=['all'].concat(D.sections.map(s=>s.key));
let tab='all',proj=false,done={},imgs={},drv={},placed={},A=null,MCP=null,DB=null,lastId='';
try{done=JSON.parse(localStorage.getItem('art_done')||'{}');proj=localStorage.getItem('art_proj')==='1';tab=localStorage.getItem('art_tab')||'all'}catch(e){}
if(!KEYS.includes(tab))tab='all';
const $=id=>document.getElementById(id);
const all=D.sections.flatMap(s=>s.items.map(i=>Object.assign({sec:s},i)));
function full(it){
  let t=it.text.replace('[concept sheet] ','');
  const body=t.replace('[STYLE]',proj?'':D.style+' ').replace('[TEXTURE]',proj?'':D.texture+' ');
  let out=body.trim();
  if(it.sec.add)out+=' '+it.sec.add;
  if(proj&&it.tex)out='(Use the project style and texture rules.) '+out;
  return out.replace(/\s+/g,' ').trim();
}
const ART='https://claude.ai/artifact/Pox9LLTYG4KqThbkBqeA9f',SID='session_0138ngZesiUmEWBYMvWp3vhr';
function st(id){return placed[id]?'g':(imgs[id]||drv[id])?'q':done[id]?'m':''}
function summary(){
  const q=all.filter(i=>st(i.id)==='q'),g=all.filter(i=>st(i.id)==='g'),m=all.filter(i=>st(i.id)).length,N=all.length;
  $('nMade').textContent=m;$('nQ').textContent=q.length;$('nG').textContent=g.length;
  $('mg').style.width=(100*g.length/N)+'%';$('mq').style.width=(100*q.length/N)+'%';
  const b=$('send');b.disabled=!q.length;b.textContent=q.length?(MCP?'Send ':'Copy ')+q.length+' queued '+(MCP?'to Claude':'for Claude'):'Nothing queued';
}
function sendText(){
  const q=all.filter(i=>st(i.id)==='q');
  const rows=q.map(i=>'- '+i.id+' '+i.title+' -> '+i.file+(imgs[i.id]?' (uploaded image, assetId '+imgs[i.id].assetId+')':' (Google Drive: '+drv[i.id].url+')')).join('\n');
  return "Place the queued art in the game. Artifact: "+ART+"\nQueued:\n"+rows+"\nRead the artifact's images and drive collections, download each file, cut the sizes with tools/make_tiers.py (add --neutral for ground maps the game tints), install under textures/, check the game loads, release as CLAUDE.md says, then add a doc per id to the artifact's placed collection.";
}
function save(){try{localStorage.setItem('art_done',JSON.stringify(done));localStorage.setItem('art_proj',proj?'1':'0');localStorage.setItem('art_tab',tab)}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1600)}
async function copy(text,btn,label){
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true}catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);
    try{ok=document.execCommand('copy')}catch(e2){}ta.remove()}
  if(ok){const old=btn.textContent;btn.textContent='Copied';btn.classList.add('ok');toast(label+' copied. Paste it into ChatGPT.');setTimeout(()=>{btn.textContent=old;btn.classList.remove('ok')},1400)}
  else toast('Copy was blocked. Open "See full text" and select it.');
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderTabs(){
  $('tabs').innerHTML=KEYS.map(k=>{
    const s=D.sections.find(x=>x.key===k),n=k==='all'?all.length:s.items.length,d=(k==='all'?all:s.items).filter(i=>st(i.id)).length;
    return `<button class="tab" data-k="${k}" aria-pressed="${k===tab}">${k==='all'?'All':esc(s.title.replace(/ and .*/,'').replace(/:.*/,''))}<small>${d}/${n}</small></button>`}).join('');
}
function render(){
  renderTabs();
  const items=tab==='all'?all:all.filter(i=>i.sec.key===tab);
  let h='',last='';
  for(const it of items){
    if(tab==='all'&&it.sec.key!==last){last=it.sec.key;h+=`<p class="note"><b>${esc(it.sec.title)}</b></p>`}
    const t=full(it);
    const S=st(it.id);h+=`<article class="card${S==='g'?' g done':S==='q'?' q':done[it.id]?' done':''}" id="c-${it.id}">
      <div class="top"><div><div class="id">${it.id}${S==='q'?'<span class="badge q">QUEUED</span>':S==='g'?'<span class="badge g">IN GAME</span>':''}${it.needs?' &middot; serves '+esc(it.needs):''}</div><h2>${esc(it.title)}</h2></div>
      <label class="tick"><input type="checkbox" data-done="${it.id}" ${done[it.id]?'checked':''}> Made</label></div>
      <p class="text">${esc(it.text.replace('[STYLE]','').replace('[TEXTURE]','').replace('[concept sheet]','').trim())}</p>
      <div class="meta">Save as ${esc(it.file)}</div>
      <div class="acts"><button class="copy" data-copy="${it.id}">Copy prompt</button>${it.pbr?`<button class="alt" data-pbr="${it.id}">Copy height + roughness follow-up</button>`:''}</div>
      ${A&&DB?`<div class="shot">${imgs[it.id]?`<img src="${esc(imgs[it.id].url)}" alt="Uploaded image for ${it.id}"><span>Uploaded ${esc(imgs[it.id].name||'')}</span>`:''}
        <label class="up">${imgs[it.id]?'Replace image':'Upload image'}<input type="file" accept="image/*" data-up="${it.id}"></label>
        ${imgs[it.id]?`<button class="alt" data-rm="${it.id}">Remove</button>`:''}</div>`:''}
      ${DB?`<div class="drive">${drv[it.id]?`<span class="meta">Drive link saved:</span> <a href="${esc(drv[it.id].url)}" target="_blank" rel="noopener">${esc(drv[it.id].url.replace(/^https?:\/\//,'').slice(0,48))}</a> <button class="alt" data-rmd="${it.id}">Remove link</button>`:`<input type="url" id="dl-${it.id}" inputmode="url" placeholder="Paste Google Drive link" aria-label="Google Drive link for ${it.id}"><button class="alt" data-sd="${it.id}">Save link</button>`}</div>`:''}
      <details><summary>See full text</summary><p>${esc(t)}</p></details>
    </article>`}
  $('list').innerHTML=h;
  const d=all.filter(i=>done[i.id]).length;
  summary();
  $('proj').checked=proj;
}
async function upload(id,file){
  const it=all.find(i=>i.id===id);if(!file||!it||!A||!DB)return;
  if(!/^image\//.test(file.type)){toast('That file is not an image.');return}
  toast('Uploading '+id+'...');
  try{
    const r=await A.upload(file);
    await DB.collection('images').doc(id).set({assetId:r.id,url:r.url,name:file.name||id,size:r.sizeBytes,type:r.contentType,target:it.file,title:it.title,at:Date.now()});
    done[id]=1;save();toast(id+' uploaded. Tell Claude to place it.')
  }catch(err){toast('Upload failed: '+((err&&err.message)||err.code||'try again'))}
}
document.addEventListener('paste',e=>{
  const f=[...(e.clipboardData?e.clipboardData.files:[])].find(x=>/^image\//.test(x.type));
  if(!f)return;if(!lastId){toast('Tap a card first, then paste.');return}
  e.preventDefault();upload(lastId,f)
});
document.addEventListener('click',async e=>{
  const sb=e.target.closest('#send');
  if(sb&&!sb.disabled){
    const msg=sendText();
    if(MCP){try{await MCP.callTool('Claude Code Remote','send_message',{session_id:SID,message:msg});toast('Sent to Claude. It will place them in the game.');return}catch(err){}}
    await copy(msg,sb,'Message');toast('Copied. Paste it into your chat with Claude.');return}
  const c=e.target.closest('.card');if(c)lastId=c.id.slice(2);
  const sd=e.target.closest('[data-sd]');
  if(sd&&DB){const id=sd.dataset.sd,it=all.find(i=>i.id===id),v=($('dl-'+id).value||'').trim();
    const m=v.match(/^https:\/\/(?:drive|docs)\.google\.com\//)&&(v.match(/\/(?:d|folders)\/([\w-]+)/)||v.match(/[?&]id=([\w-]+)/));
    if(!m){toast('That is not a Google Drive link.');return}
    DB.collection('drive').doc(id).set({url:v,fileId:m[1],folder:/\/folders\//.test(v),target:it.file,title:it.title,at:Date.now()}).then(()=>{done[id]=1;save();toast(id+' link saved. Tell Claude to place it.')}).catch(()=>toast('Could not save the link.'));return}
  const rmd=e.target.closest('[data-rmd]');
  if(rmd&&DB){DB.collection('drive').doc(rmd.dataset.rmd).delete().catch(()=>toast('Could not remove it.'));return}
  const rm=e.target.closest('[data-rm]');
  if(rm&&DB){DB.collection('images').doc(rm.dataset.rm).delete().catch(()=>toast('Could not remove it.'));return}
  const t=e.target.closest('[data-k],[data-copy],[data-pbr]');if(!t)return;
  if(t.dataset.k){tab=t.dataset.k;save();render();window.scrollTo({top:0})}
  else if(t.dataset.copy){const it=all.find(i=>i.id===t.dataset.copy);copy(full(it),t,it.id)}
  else if(t.dataset.pbr){copy(D.pbr,t,'Follow-up')}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.up){const f=e.target.files[0];upload(e.target.dataset.up,f);e.target.value='';return}
  if(e.target.id==='proj'){proj=e.target.checked;save();render();return}
  const id=e.target.dataset.done;if(!id)return;
  if(e.target.checked)done[id]=1;else delete done[id];
  save();const c=$('c-'+id);if(c)c.classList.toggle('done',!!done[id]);
  summary();renderTabs();
});
render();
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    A=await window.claude.use('assets');DB=await window.claude.use('db');try{MCP=await window.claude.use('mcp')}catch(e){MCP=null}
    if(!DB){A=DB=null;return}
    DB.collection('placed').onSnapshot(snap=>{placed={};snap.docs.forEach(d=>{placed[d.id]=d.data()});render()},()=>{});
    DB.collection('drive').onSnapshot(snap=>{drv={};snap.docs.forEach(d=>{drv[d.id]=d.data()});render()},()=>{});
    DB.collection('images').onSnapshot(snap=>{imgs={};snap.docs.forEach(d=>{imgs[d.id]=d.data()});render()},()=>{});
  }catch(e){A=DB=null}
})();
</script>
