<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Corley's Island Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Saira:wght@400;500;600&display=swap">
<style>
/* Layout: one column; a summary strip, the places to go, then one doc at a time picked from the tabs (same look as build.html) */
:root{
  --bg:#f3f1ec; --panel:#ffffff; --ink:#1b1d1a; --muted:#545a52; --line:#d6d3cb;
  --machine:#d9631a; --machine-soft:#f6dcc8; --ok:#2f7d4a; --grid:#e6e3dc;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif; --f-body:"Saira",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141613; --panel:#1d201c; --ink:#eef0ea; --muted:#b4bbae; --line:#343a33;
  --machine:#f28a3c; --machine-soft:#4a2c17; --ok:#86d98f; --grid:#2a2f29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141613; --panel:#1d201c; --ink:#eef0ea; --muted:#b4bbae; --line:#343a33;
  --machine:#f28a3c; --machine-soft:#4a2c17; --ok:#86d98f; --grid:#2a2f29; color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5}
main{max-width:980px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
h1{margin:0;font:800 clamp(38px,7vw,60px)/1 var(--f-display);letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--machine)}
h2{margin:0 0 12px;font:800 28px/1.1 var(--f-display);letter-spacing:.02em}
.lede{margin:10px 0 0;color:var(--muted);max-width:62ch;font-size:19px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.stat .k{font:700 14px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:800 38px/1.05 var(--f-display);margin-top:6px;font-variant-numeric:tabular-nums}
.stat .s{font-size:16px;color:var(--muted);margin-top:4px}
.stat.hot{border-color:var(--machine)}
.stat.hot .v{color:var(--machine)}
.go{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.go a{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--ink);text-decoration:none;min-width:0}
.go a:hover,.go a:focus-visible{border-color:var(--machine)}
.go b{display:block;font:800 21px/1.15 var(--f-display);letter-spacing:.02em;color:var(--machine)}
.go span{display:block;font-size:15px;color:var(--muted);margin-top:2px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:700 17px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--machine);border-color:var(--machine);color:#fff}
#doc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 22px 18px;min-width:0;overflow-wrap:anywhere}
#doc h1{font-size:clamp(30px,5vw,42px);margin:16px 0 8px}
#doc h2{margin:26px 0 8px;padding-top:6px;border-top:1px solid var(--line)}
#doc h3{font:800 22px/1.2 var(--f-display);margin:18px 0 6px}
#doc a{color:var(--machine);font-weight:600}
#doc ul{padding-left:1.2em}
#doc li{margin:3px 0}
#doc li:has(> input[type=checkbox]){list-style:none;margin-left:-1.2em}
#doc input[type=checkbox]{accent-color:var(--ok);margin-right:6px}
#doc code{font-size:.88em;background:var(--grid);padding:1px 5px;border-radius:5px}
#doc table{border-collapse:collapse;width:100%;font-size:16px;display:block;overflow-x:auto}
#doc th{font:700 13px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line)}
#doc td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
#doc em{color:var(--muted)}
.edit{font-size:15px;color:var(--muted);margin:14px 0 0}
.edit a{color:var(--machine)}
footer{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Corley's Island <span>hub</span></h1>
    <p class="lede">Everything about the game in one place: where it stands, where it's going, and every document behind it.</p>
  </header>
  <div class="strip" id="strip"></div>
  <section aria-labelledby="go-h">
    <h2 id="go-h">Go to</h2>
    <nav class="go" id="go"></nav>
  </section>
  <section aria-labelledby="docs-h">
    <h2 id="docs-h">Documents</h2>
    <div class="tabs" role="tablist" id="tabs"></div>
  </section>
  <article id="doc" role="tabpanel" aria-live="polite"></article>
  <footer>The documents are the files in the repo, read live; change a file and this page shows it after the next deploy.</footer>
</main>
<script src="data/effort.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const E=window.EFFORT,$=id=>document.getElementById(id),REPO='https://github.com/corleythax-creator/backhoe-dig';
// the documents, in tab order: id (the page's #hash), tab name, repo path
const DOCS=[
  ['roadmap','Roadmap','docs/ROADMAP.md'],
  ['gdd','Design doc','docs/GDD.md'],
  ['changelog','Changelog','CHANGELOG.md'],
  ['ideas','Ideas','docs/IDEAS.md'],
  ['workflow','Workflow','docs/WORKFLOW.md'],
  ['credits','Credits','CREDITS.md'],
  ['sounds','Sound credits','sounds/CREDITS.md'],
  ['mapeditor','Map editor','docs/map-editor.md'],
];
const GO=[
  ['./','Play','The live game'],
  ['build.html','Build log','Hours and versions, charted'],
  ['versions/','Old versions','Every version, playable'],
  ['https://claude.ai/artifact/FMrDEa4VsKvPS5Z3ktTrS3','Idea board','Score and pick what comes next'],
  ['https://claude.ai/artifact/Bj6MjgPkszqEP2PJQqQ29t','Screen editor','Restyle the HUD and publish it'],
  ['docs/island-plans.html','Island plans','The islands, laid out'],
  ['docs/dig-plans.html','Dig plans','How digging anywhere works'],
  ['docs/image-prompts.html','Image prompts','The art prompts for textures'],
  [REPO,'GitHub','The code and every file'],
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('go').innerHTML=GO.map(([h,n,s])=>`<a href="${h}"${h.startsWith('http')?' target="_blank" rel="noopener"':''}><b>${n}</b><span>${s}</span></a>`).join('');

// summary strip: the version from the build log, the ideas from IDEAS.md and the board's Done list
const V=E.versions,last=V[V.length-1],hours=V.reduce((a,v)=>a+(v.dh||0),0);
const stat=(k,v,s,hot)=>`<div class="stat${hot?' hot':''}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${esc(s)}</div></div>`;
const live=new Date(last.live).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'America/Chicago'});
function strip(ideas){
  $('strip').innerHTML=stat('Version','v'+last.v,'live '+live,1)+stat('Versions shipped',V.length,'since '+new Date(V[0].live).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'America/Chicago'}))+
    stat('Developer hours',Math.round(hours).toLocaleString('en-US'),'one developer by hand')+(ideas?stat('Ideas done',`${ideas.done}/${ideas.all}`,`${ideas.part} part done`):'');
}
strip();
Promise.all([fetch('docs/IDEAS.md').then(r=>r.text()),fetch('docs/idea-board.html').then(r=>r.text())]).then(([md,html])=>{
  const all=(md.match(/^- [A-Z]\d\d /gm)||[]).length,i=html.indexOf('const DONE={'),d=html.slice(i,html.indexOf('};',i));
  const ids=d.match(/^[A-Z]\d\d:/gm)||[],part=(d.match(/part:true/g)||[]).length;
  strip({all,done:ids.length-part,part});
}).catch(()=>{});

// tabs: one doc at a time, kept in the #hash; links inside a doc to another listed doc open its tab
$('tabs').innerHTML=DOCS.map(([id,n])=>`<button role="tab" id="t-${id}" aria-selected="false" data-id="${id}">${n}</button>`).join('');
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)location.hash=b.dataset.id};
const cache={};
async function show(){
  const doc=DOCS.find(d=>d[0]===location.hash.slice(1))||DOCS[0],[id,n,path]=doc;
  for(const b of $('tabs').children)b.setAttribute('aria-selected',b.dataset.id===id);
  $('doc').setAttribute('aria-labelledby','t-'+id);
  try{
    if(!cache[path]){const r=await fetch(path,{cache:'no-cache'});if(!r.ok)throw r.status;cache[path]=await r.text()}
    $('doc').innerHTML=marked.parse(cache[path])+`<p class="edit"><a href="${REPO}/blob/main/${path}" target="_blank" rel="noopener">${path} on GitHub</a></p>`;
  }catch(err){$('doc').innerHTML=`<p>Couldn't load ${esc(path)} (${esc(err)}). <a href="${REPO}/blob/main/${path}">Open it on GitHub</a>.</p>`}
  // repo-relative links: another listed doc opens its tab, anything else opens on GitHub
  const base=path.includes('/')?path.slice(0,path.lastIndexOf('/')+1):'';
  for(const a of $('doc').querySelectorAll('a[href]')){
    const h=a.getAttribute('href');if(/^(https?:|#|mailto:)/.test(h))continue;
    const full=new URL(h,'https://x/'+base).pathname.slice(1),hit=DOCS.find(d=>d[2]===full);
    a.href=hit?'#'+hit[0]:`${REPO}/blob/main/${full}`;
  }
  // `docs/ROADMAP.md` written as code opens its tab too
  for(const c of $('doc').querySelectorAll('code')){
    const hit=DOCS.find(d=>d[2]===c.textContent);
    if(hit&&!c.closest('a')){const a=document.createElement('a');a.href='#'+hit[0];c.replaceWith(a);a.append(c)}
  }
}
addEventListener('hashchange',()=>{show();$('doc').scrollIntoView({block:'start'})});
show();
</script>
</body>
</html>
